name: Image Vulnerability Scan

# Non-blocking scan of the published backend image for OS-level
# vulnerabilities, run weekly and after every published release. See
# docs/deployment.md (Image Vulnerability Monitoring) for the full
# rationale: Python dependencies are covered by
# GitHub Dependabot alerts, Renovate vulnerability-fix PRs, and the
# pip-audit gate on dependency changes and Release PRs, but the Debian
# base layer (python:3.14-slim) is otherwise unmonitored for known
# vulnerabilities.
# Renovate proposes PRs bumping the ARG-templated base image digest in
# backend/Dockerfile (its dockerfile manager resolves ARG values
# natively), but that only refreshes the pinned layer going forward —
# it does not scan the currently published image for known
# vulnerabilities. This workflow's Trivy scan remains the mechanism
# that detects those vulnerabilities in the layer already shipped.
#
# This workflow never fails the run because of scan findings and never
# touches build-images.yml or the publish path. Fixable HIGH/CRITICAL
# findings open or update a single tracking issue, and a scan that finds
# none closes that issue again; the complete report (all severities,
# informational) is uploaded as an artifact. A scan that does not
# complete fails the run and leaves the issue unchanged.

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  # After a release: `latest` moves only when a version-tag run of
  # build-images.yml pushes its image, and that run publishes the GitHub
  # Release as its last step. The `release: published` event cannot be
  # used instead, because the release is published with the GITHUB_TOKEN,
  # whose events start no workflow runs. The branch filter drops every
  # master build (head branch `master`; a version-tag run's head branch is
  # the tag name) before it joins the concurrency group, so a master build
  # neither adds a skipped run nor replaces a pending release scan; the
  # job condition below is the actual gate.
  workflow_run:
    workflows: ["Build Docker Images"]
    branches-ignore: [master]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: image-scan
  cancel-in-progress: false

permissions:
  packages: read
  issues: write

env:
  SECURITY_LABEL: security
  # The title identifies the open tracking issue across runs; renaming it
  # would orphan an issue opened under the previous title.
  ISSUE_TITLE: "Weekly image scan: fixable HIGH/CRITICAL vulnerabilities detected"
  # Trivy's official image, pinned by version and digest and updated by
  # Renovate (docs/deployment.md, Workflow Conventions).
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  image-scan:
    name: Scan Published Image
    # A workflow_run trigger scans only after a successful version-tag
    # (`push`) run of build-images.yml, i.e. once `latest` points to its
    # image and its release is published. master builds never move
    # `latest`, and a failed run may not have published anything.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Compute lowercase image reference
        id: image
        run: |
          set -euo pipefail
          repo_lower=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${repo_lower}:latest" >>"${GITHUB_OUTPUT}"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Trivy reads an archive of the image rather than the registry, so
      # the registry credentials stay on the runner, and both scans cover
      # the same image even if `latest` moves during the run.
      - name: Pull and export the published image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REF}"
          docker save --output "${RUNNER_TEMP}/image.tar" "${IMAGE_REF}"

      - name: Pull the pinned Trivy image
        run: docker pull "${TRIVY_IMAGE}"

      # Both scans are restricted to OS packages (--pkg-types=os) —
      # Python dependency vulnerabilities are covered separately (see
      # docs/deployment.md, Workflow Conventions, Python dependency
      # updates and vulnerability response); this workflow exists
      # specifically for the unmonitored OS layer.
      # --scanners=vuln: Trivy's secret scanner is deliberately not
      # enabled here — no CI job or Action performs secret scanning (see
      # docs/features/platform/testing-strategy.md, Pre-Commit Hooks);
      # that coverage is local-only via gitleaks.
      #
      # The fixable-only scan (HIGH/CRITICAL with a known fix) drives
      # issue creation, update, and closure through the `fixable` output,
      # `found` or `none`. Trivy itself exits with 1 on an error, so a
      # finding exits with a code of its own; an error fails the step and
      # sets no output, so neither tracking-issue step runs. The complete
      # report, every finding regardless of fix availability or severity,
      # is for awareness only and reuses the vulnerability database of the
      # first scan.
      #
      # Trivy runs with the runner's user and group IDs, without
      # capabilities or privilege escalation, and reads the archive
      # read-only; it receives neither the Docker socket, the registry
      # credentials, a token, nor an environment variable of the runner.
      # It writes only into its database cache, which the runner never
      # reads, and prints each report, which the runner's shell saves: no
      # file that a later step reads, such as a symbolic link to a file of
      # the runner, comes from the container. The commands stay inline
      # because the job has no checkout and runs no repository code.
      - name: Scan for OS vulnerabilities
        id: trivy
        run: |
          set -euo pipefail
          readonly FINDINGS_EXIT_CODE=3
          mkdir -p "${RUNNER_TEMP}/trivy" "${RUNNER_TEMP}/trivy-cache"
          run_trivy() {
              docker run --rm --pull=never \
                  --user="$(id -u):$(id -g)" \
                  --cap-drop=ALL \
                  --security-opt=no-new-privileges \
                  --volume="${RUNNER_TEMP}/image.tar:/scan/image.tar:ro" \
                  --volume="${RUNNER_TEMP}/trivy-cache:/scan/cache" \
                  "${TRIVY_IMAGE}" image \
                  --input=/scan/image.tar \
                  --cache-dir=/scan/cache \
                  --scanners=vuln \
                  --pkg-types=os \
                  --format=table \
                  --disable-telemetry \
                  --skip-version-check \
                  "$@"
          }
          status=0
          run_trivy --ignore-unfixed --severity=HIGH,CRITICAL \
              --exit-code="${FINDINGS_EXIT_CODE}" \
              >"${RUNNER_TEMP}/trivy/trivy-fixable.txt" || status=$?
          case "${status}" in
              0) fixable=none ;;
              "${FINDINGS_EXIT_CODE}") fixable=found ;;
              *) exit "${status}" ;;
          esac
          run_trivy --skip-db-update --exit-code=0 \
              >"${RUNNER_TEMP}/trivy/trivy-full.txt"
          echo "fixable=${fixable}" >>"${GITHUB_OUTPUT}"

      - name: Upload complete vulnerability report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/trivy/trivy-full.txt
          retention-days: 90
          # Single-file direct upload (no zip): the artifact name
          # matches the file name (trivy-full.txt) and is readable
          # without downloading and extracting an archive first.
          archive: false

      # Only reached when the fixable-only scan (above) found at least
      # one HIGH/CRITICAL vulnerability (`fixable` output `found`). Opens
      # a new issue, or updates the existing open one so consecutive runs
      # never create a duplicate.
      - name: Open or update tracking issue for fixable findings
        if: steps.trivy.outputs.fixable == 'found'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body_file=$(mktemp)
          {
            echo "Automated scan of \`${{ steps.image.outputs.ref }}\` found fixable HIGH/CRITICAL OS-level vulnerabilities."
            echo ""
            echo "This scan is non-blocking by design (see \`docs/deployment.md\`, Image Vulnerability Monitoring). Renovate periodically proposes a PR bumping \`PYTHON_BASE_DIGEST\` in \`backend/Dockerfile\` to the current \`python:3.14-slim\` digest (see \`docs/deployment.md\`, Container Build Conventions → Base image pinning); merging the latest such PR is the expected remediation. If no pending Renovate PR resolves this finding, a maintainer can resolve the current digest manually and open one directly. Merge the remediating PR with a \`fix(deps):\` commit subject so that release-please proposes a patch release that ships the fix; for a Renovate PR, set the subject when squash-merging, because Renovate restores its own PR title (see \`docs/deployment.md\`, Image Vulnerability Monitoring → Remediation path, and Squash Merge). The scan that runs after that release closes this issue once no fixable finding remains."
            echo ""
            echo "<details><summary>Fixable HIGH/CRITICAL findings</summary>"
            echo ""
            echo '````'
            head -c 60000 "${RUNNER_TEMP}/trivy/trivy-fixable.txt"
            echo '````'
            echo ""
            echo "</details>"
            echo ""
            echo "The complete report (all severities, including unfixable) is attached to [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) as the \`trivy-full.txt\` artifact."
          } >"${body_file}"

          existing=$(gh issue list --repo "${{ github.repository }}" \
              --state open --label "${SECURITY_LABEL}" \
              --json number,title \
              --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n1)

          if [[ -n "${existing}" ]]; then
              gh issue edit "${existing}" --repo "${{ github.repository }}" --body-file "${body_file}"
          else
              gh issue create --repo "${{ github.repository }}" \
                  --title "${ISSUE_TITLE}" --label "${SECURITY_LABEL}" \
                  --body-file "${body_file}"
          fi

      # Reached only when the fixable-only scan (above) found nothing
      # (`fixable` output `none`). If a tracking issue from an earlier run
      # is still open, the condition it tracked no longer exists — close
      # it so a remediated finding (typically a merged Renovate base-image
      # digest bump, shipped by a release) does not leave a stale issue
      # behind. A scan that does not complete fails its step and sets no
      # output, so an error never closes the issue.
      - name: Close tracking issue when the scan is clean
        if: steps.trivy.outputs.fixable == 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "${{ github.repository }}" \
              --state open --label "${SECURITY_LABEL}" \
              --json number,title \
              --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n1)

          if [[ -n "${existing}" ]]; then
              gh issue close "${existing}" --repo "${{ github.repository }}" \
                  --comment "The latest image scan found no fixable HIGH/CRITICAL OS-level vulnerabilities in \`${{ steps.image.outputs.ref }}\`, so the tracked condition is resolved. See the [clean workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi
