services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    # Mounted at the /var/lib/postgresql parent, not .../data: the
    # official postgres images changed PGDATA to
    # /var/lib/postgresql/<major>/docker starting with the 18 release
    # (https://github.com/docker-library/postgres/pull/1259). Mounting
    # at .../data (the pre-18 convention) makes the entrypoint refuse
    # to start, reporting unused/incompatible data in the old location.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.3@sha256:7671653d5e27b7e1a4cee76b46e63753b36c75b475dc8fcd88d2d31143a258c2
    # redis-server directly, as the image's non-root user, without
    # capabilities or privilege escalation: the image's entrypoint would load
    # its bundled modules, which Sentinel does not use (docs/deployment.md,
    # Software Requirements), and is also what drops these privileges.
    entrypoint: ["redis-server"]
    user: redis
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
